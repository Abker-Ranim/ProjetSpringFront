<ngx-spinner
  bdColor="rgba(51,51,51,0.8)"
  size="medium"
  color="#fff"
  type="ball-spin"
>
  <p style="font-size: 20px; color: white">Loading...</p>
</ngx-spinner>

<div class="auth-container">
  <div class="auth-card">
    <h1 class="app-title">EventiCar</h1>

    <!-- Login Form -->
    <div class="auth-form" [class.active]="!isSignUpMode">
      <h2 class="auth-title">Login </h2>
      <p class="auth-subtitle">Please login to continue to your account.</p>

      <form [formGroup]="loginForm" (ngSubmit)="onLogin()" class="form">
        <div class="form-group">
          <label>Email</label>
          <div class="input-wrapper">
            <input
              type="text"
              formControlName="email"
              placeholder="Enter your email"
              [class.invalid]="
                loginForm.get('email')?.invalid &&
                loginForm.get('email')?.touched
              "
            />
            <fa-icon [icon]="faEnvelope" class="input-icon"></fa-icon>
          </div>
          <div
            *ngIf="
              loginForm.get('email')?.invalid && loginForm.get('email')?.touched
            "
            class="error-message"
          >
            Email is required.
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-wrapper">
            <input
              type="password"
              formControlName="password"
              placeholder="Enter your password"
              [class.invalid]="
                loginForm.get('password')?.invalid &&
                loginForm.get('password')?.touched
              "
            />
            <fa-icon [icon]="faLock" class="input-icon"></fa-icon>
          </div>
          <div
            *ngIf="
              loginForm.get('password')?.invalid &&
              loginForm.get('password')?.touched
            "
            class="error-message"
          >
            Password is required.
          </div>
        </div>

        <div class="remember-me">
          <input type="checkbox" id="remember" />
          <label for="remember">Keep me logged in</label>
        </div>

        <button type="submit" class="auth-btn" [disabled]="loginForm.invalid">
          Login
        </button>

        <div class="divider">
          <span class="divider-line"></span>
          <span class="divider-text">or</span>
          <span class="divider-line"></span>
        </div>

        <div *ngIf="loginError" class="auth-error">
          Email or Password incorrect.
        </div>
      </form>

      <p class="auth-switch">
        Need an account? <a (click)="toggleMode()">Create one</a>
      </p>
    </div>

    <!-- Sign Up Form -->
    <div class="auth-form" [class.active]="isSignUpMode">
      <h2 class="auth-title">Sign up</h2>
      <p class="auth-subtitle">Create your account to get started.</p>

      <form [formGroup]="signupForm" (ngSubmit)="onSignup()" class="form">
        <div class="form-group">
          <label>Full Name</label>
          <div class="input-wrapper">
            <input
              type="text"
              formControlName="fullName"
              placeholder="Enter your full name"
            />
            <fa-icon [icon]="faUser" class="input-icon"></fa-icon>
          </div>
        </div>

        <div class="form-group">
          <label>Email</label>
          <div class="input-wrapper">
            <input
              type="email"
              formControlName="email"
              placeholder="your.email@example.com"
            />
            <fa-icon [icon]="faEnvelope" class="input-icon"></fa-icon>
          </div>
        </div>

        <div class="form-group">
          <label>Password</label>
          <div class="input-wrapper">
            <input
              type="password"
              formControlName="password"
              placeholder="Create a password"
            />
            <fa-icon [icon]="faLock" class="input-icon"></fa-icon>
          </div>
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <div class="input-wrapper">
            <input
              type="password"
              formControlName="confirmPassword"
              placeholder="Confirm your password"
            />
            <fa-icon [icon]="faLock" class="input-icon"></fa-icon>
          </div>
        </div>

        <button type="submit" class="auth-btn" [disabled]="signupForm.invalid">
          Sign up
        </button>

        <div *ngIf="signupError" class="auth-error">
          {{ signupError }}
        </div>
      </form>

      <p class="auth-switch">
        Already have an account? <a (click)="toggleMode()">Login</a>
      </p>
    </div>
  </div>
</div>
