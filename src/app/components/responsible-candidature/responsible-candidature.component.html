<div class="admin-container">
    <header class="admin-header">     
    </header>
  
    <div class="filters-section">
      <div class="search-box">
        <i class="fas fa-search search-icon"></i>
        <input 
          type="text" 
          placeholder="Rechercher par nom, email, événement..." 
          [(ngModel)]="searchTerm"
          (input)="applyFilters()"
        >
      </div>
      
      <div class="filter-buttons">
        <button 
          [class.active]="filterStatut === 'tous'" 
          (click)="filterStatut = 'tous'; applyFilters()">
          Toutes
        </button>
        <button 
          [class.active]="filterStatut === 'en_attente'" 
          (click)="filterStatut = 'en_attente'; applyFilters()">
          En attente
        </button>
        <button 
          [class.active]="filterStatut === 'acceptee'" 
          (click)="filterStatut = 'acceptee'; applyFilters()">
          Acceptées
        </button>
        <button 
          [class.active]="filterStatut === 'refusee'" 
          (click)="filterStatut = 'refusee'; applyFilters()">
          Refusées
        </button>
      </div>
    </div>
  
    <div class="candidatures-list">
      <div *ngIf="filteredCandidatures.length === 0" class="no-results">
        <i class="fas fa-search"></i>
        <p>Aucune candidature trouvée</p>
      </div>
  
      <div *ngFor="let candidature of filteredCandidatures" class="candidature-card">
        <div class="candidature-header">
          <div class="candidat-info">
            <h3>{{ candidature.candidatEmail }}</h3>
          </div>
          <div class="candidature-date">
            <i class="far fa-calendar-alt"></i>
            {{ candidature.datePostulation | date:'dd/MM/yyyy' }}
          </div>
        </div>
  
        <div class="candidature-body">
          <div class="candidature-details">
            <div class="detail-item">
              <span class="detail-label">Événement:</span>
              <span class="detail-value">{{ candidature.evenementNom }}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Poste:</span>
              <span class="detail-value">{{ candidature.poste }}</span>
            </div>
            <div class="detail-item">
              <span class="detail-label">Statut:</span>
              <span class="detail-value statut-badge" [ngClass]="getStatutClass(candidature.statut)">
                {{ getStatutLabel(candidature.statut) }}
              </span>
            </div>
          </div>
  
          <div class="candidature-motivation">
            <h4>Motivation:</h4>
            <p>{{ candidature.motivation }}</p>
          </div>
         
        </div>
      </div>
    </div>
  
    <div class="pagination" *ngIf="totalPages > 1">
      <button [disabled]="currentPage === 1" (click)="changePage(currentPage - 1)">
        <i class="fas fa-chevron-left"></i>
      </button>
      <span *ngFor="let page of getPageNumbers()" 
            [class.active]="page === currentPage"
            (click)="changePage(page)">
        {{ page }}
      </span>
      <button [disabled]="currentPage === totalPages" (click)="changePage(currentPage + 1)">
        <i class="fas fa-chevron-right"></i>
      </button>
    </div>
</div>
