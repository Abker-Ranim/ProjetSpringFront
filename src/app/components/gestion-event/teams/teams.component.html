<section class="event-section">
  <div class="section-header">
    <h2 class="section-title">
      <i class="fas fa-users"></i> Teams 
    </h2>
    <button *ngIf="isAdmin()" class="add-team-button" (click)="openAddForm()">
      <i class="fas fa-plus"></i> Ajouter une équipe
    </button>
  </div>

  <div *ngIf="loading" class="loading">
    <div class="spinner"></div>
    <p>Chargement des équipes...</p>
  </div>

  <div *ngIf="!loading && teams.length === 0" class="no-teams">
    <i class="fas fa-info-circle"></i>
    <p>Aucune équipe trouvée</p>
  </div>
  
  <div *ngIf="!loading" class="teams-grid">
    <div class="team-card" *ngFor="let team of teams">
      <div class="team-header">
        <div class="team-icon">
          <i class="fas fa-users"></i>
        </div>
        <div class="team-title">
          <h3>{{ team.name }}</h3>
        </div>
      </div>
      <div class="team-body">
        <h4>Description</h4>
        <p>{{ team.description }}</p>
      </div>
    </div>
  </div>
</section>

<div class="modal" *ngIf="showAddForm">
  <div class="modal-content">
    <div class="modal-header">
      <h2>Ajouter une équipe</h2>
      <button class="close-button" (click)="closeAddForm()">×</button>
    </div>
    <div class="modal-body">
      <form [formGroup]="addForm" (ngSubmit)="submitApplication()">
        <div class="form-group">
          <label for="name">Nom de l'équipe</label>
          <input type="text" id="name" formControlName="name" placeholder="Nom de l'équipe" />
          <div *ngIf="addForm.get('name')?.invalid && addForm.get('name')?.touched" class="error-message">
            <i class="fas fa-exclamation-circle"></i> Le nom de l'équipe est requis
          </div>
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea 
            id="description" 
            formControlName="description" 
            placeholder="Description de l'équipe et de ses responsabilités">
          </textarea>
          <div *ngIf="addForm.get('description')?.invalid && addForm.get('description')?.touched" class="error-message">
            <i class="fas fa-exclamation-circle"></i> La description est requise
          </div>
        </div>
        
        <div class="form-actions">
          <button type="button" class="cancel-button" (click)="closeAddForm()">
            Annuler
          </button>
          <button
            type="submit"
            class="submit-button"
            [disabled]="addForm.invalid || submitting"
          >
            <span *ngIf="!submitting">Ajouter l'équipe</span>
            <span *ngIf="submitting">
              <div class="spinner-small"></div>
              Ajout en cours...
            </span>
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
